# Purpose-bound chats. When a message arrives on a channel listed here,
# the sensor applies the group's default_intent if no explicit intent
# matches the text. Slash commands always escape the default.
#
# chat_ids accept either the bare channel_id (e.g. "-1001234567890" for a
# Telegram group) or a prefixed form ("telegram:-100...", "web:notes").
groups:
  notifications:
    description: "Agent + system notifications"
    chat_ids: ["web:notifications"]
    purpose: notifications
    default_intent: null
    allow_agent_post: true

  files:
    description: "Drop files & run commands"
    chat_ids: ["web:files"]
    purpose: files
    default_intent: drop_file

  notes:
    description: "Notes — bare text → note in default_tag"
    chat_ids: ["web:notes"]
    purpose: notes
    default_intent: drop_note
    default_tag: inbox
